# Windows installer (NSIS) and portable exe, built on a real Windows runner
# and published as a workflow artifact.
#
# Why this exists: releases are cut by hand from a Mac, which cannot build
# an NSIS installer (electron-builder needs wine, and a cross-built exe
# that never ran on Windows is exactly the artifact that looks fine and
# breaks in the field). So every release so far shipped Windows behind the
# mac build — different trees under one version number. Run this from the
# same commit as the mac build and attach the artifact to the release.
#
# Deliberately artifact-only: the full release workflow is the one place
# allowed to create a GitHub release.
name: Package Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this is run from)"
        required: false
        type: string

jobs:
  package:
    name: NSIS installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the packaged app ships compiled JS, so a stale dist/ or dist-server/
      # would ride along unsigned-for and unsealed (the 0.1.15 "damaged"
      # incident) — a fresh checkout is clean, but be explicit
      - name: clean build outputs
        shell: bash
        run: rm -rf dist dist-server release
      - run: pnpm package:win
      - name: Verify the bundled browser with an empty home
        run: node scripts/smoke-browser-bundle.mjs --resources "${{ github.workspace }}/release/win-unpacked/resources"
      - name: Verify the packaged server discovers its browser
        env:
          JLFBOT_SMOKE_DIST: ${{ github.workspace }}/release/win-unpacked/resources/server
        run: node scripts/smoke-packaged-server.mjs --browser-bundle "${{ github.workspace }}/release/win-unpacked/resources/browser-engine"
      - name: report what was built
        shell: bash
        run: |
          echo "version: $(node -p "require('./package.json').version")"
          echo "commit:  $(git rev-parse HEAD)"
          ls -lh release/*.exe release/*.yml 2>/dev/null || true
      # Three things silently produce an installer that builds fine and is
      # broken in the field, and none of them can be checked from the Mac the
      # release is cut on — the artifact carries only the .exe. So assert them
      # here, where the unpacked tree exists, and fail the build instead of
      # shipping it.
      - name: verify the packaged tree
        shell: bash
        run: |
          res=release/win-unpacked/resources
          fail=0
          # missing → utilityProcess.fork fails → the 🐭 "Couldn't start the
          # bot server" page
          [ -f "$res/server/index.js" ] || { echo "::error::missing $res/server/index.js"; fail=1; }
          # missing → the server has nothing to serve → black window
          [ -f "$res/ui/index.html" ] || { echo "::error::missing $res/ui/index.html"; fail=1; }
          [ -f "$res/cloudflared/cloudflared.exe" ] || {
            echo "::error::missing $res/cloudflared/cloudflared.exe"; fail=1; }
          [ -f "$res/licenses/cloudflared-LICENSE.txt" ] || {
            echo "::error::missing cloudflared Apache 2.0 license"; fail=1; }
          [ -f "$res/licenses/cloudflared-README.md" ] || {
            echo "::error::missing cloudflared release provenance"; fail=1; }
          if [ -f "$res/cloudflared/cloudflared.exe" ]; then
            expected=c29eee2b121f5436a642eed69fd9767da7e7b8c510fa50aaa130337f931357b5
            actual=$(sha256sum "$res/cloudflared/cloudflared.exe" | cut -d' ' -f1)
            [ "$actual" = "$expected" ] || {
              echo "::error::packaged cloudflared hash is $actual"; fail=1; }
            "$res/cloudflared/cloudflared.exe" version | grep -Fq "cloudflared version 2026.8.2 " || {
              echo "::error::packaged cloudflared has the wrong version"; fail=1; }
          fi
          [ -f "$res/app-update.yml" ] || { echo "::error::missing $res/app-update.yml"; fail=1; }
          if [ -f "$res/app-update.yml" ]; then
            grep -Eq '^repo: ASLBot$' "$res/app-update.yml" || {
              echo "::error::app-update.yml does not point at jaylfronteras/ASLBot"; fail=1; }
            if [ -e "$res/cua-driver.exe" ] || [ -e "$res/cua-sdk" ]; then
              echo "::error::Windows package still contains a computer-use runtime"; fail=1;
            fi
            # while the build is unsigned, a publisherName makes
            # electron-updater reject every update as untrusted
            if grep -q "publisherName" "$res/app-update.yml"; then
              echo "::error::app-update.yml carries publisherName on an unsigned build"; fail=1
            fi
          fi
          echo "--- app-update.yml ---"; cat "$res/app-update.yml" 2>/dev/null || true
          exit $fail

      # index.js EXISTING is not the same as index.js RUNNING. 0.1.24 shipped a
      # server that died instantly on ERR_MODULE_NOT_FOUND because tsc left a
      # bare `zod` import in a tree that carries no node_modules — and the
      # existence check above passed it. Start the real packaged copy here,
      # where node_modules genuinely is not present.
      - name: start the packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          HOME="$RUNNER_TEMP/jlfbot-smoke" USERPROFILE="$RUNNER_TEMP/jlfbot-smoke" \
            JLFBOT_PORT=21987 node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1; then
              echo "packaged server answered /api/health ✓"
              kill $pid 2>/dev/null || true
              exit 0
            fi
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          kill $pid 2>/dev/null || true
          exit 1

      # The release carries exactly these files. latest.yml is the updater
      # feed for the NSIS installer; it must never point at the portable exe
      # (which does not self-update).
      - name: verify the release files
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          fail=0
          for f in "release/ASLBot-${version}-setup.exe" "release/ASLBot-${version}-setup.exe.blockmap" \
                   release/latest.yml "release/ASLBot-${version}-portable.exe"; do
            [ -f "$f" ] || { echo "::error::missing $f"; fail=1; }
          done
          grep -Fq "ASLBot-${version}-setup.exe" release/latest.yml || {
            echo "::error::latest.yml does not reference ASLBot-${version}-setup.exe"; fail=1; }
          if grep -qi portable release/latest.yml; then
            echo "::error::latest.yml references the portable exe"; fail=1
          fi
          echo "--- latest.yml ---"; cat release/latest.yml
          exit $fail

      # Run the real portable exe from a folder standing in for a USB drive,
      # with the packaged renderer smoke hook, and prove it keeps everything in
      # ASLBot-data beside the exe and leaves the host profile untouched.
      - name: smoke-launch the portable exe from a USB-like folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "require('./package.json').version"
          $drive = Join-Path $env:RUNNER_TEMP "usb-drive"
          New-Item -ItemType Directory -Force $drive | Out-Null
          Copy-Item "release/ASLBot-$version-portable.exe" $drive
          $exe = Join-Path $drive "ASLBot-$version-portable.exe"
          $data = Join-Path $drive "ASLBot-data"
          $result = Join-Path $env:RUNNER_TEMP "portable-smoke.txt"
          $hostPaths = @(
            (Join-Path $env:USERPROFILE ".aslbot"),
            (Join-Path $env:APPDATA "ASLBot"), (Join-Path $env:APPDATA "aslbot"),
            (Join-Path $env:LOCALAPPDATA "ASLBot"), (Join-Path $env:LOCALAPPDATA "aslbot-updater")
          )
          foreach ($p in $hostPaths) { if (Test-Path $p) { throw "host path exists before the smoke: $p" } }

          $env:JLFBOT_SMOKE_TEST = "1"
          $env:JLFBOT_SMOKE_RESULT_FILE = $result
          $proc = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddMinutes(4)
          while (-not (Test-Path $result) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $result)) {
            Get-ChildItem -Recurse $data -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -AutoSize | Out-String -Width 400 | Write-Host
            Get-ChildItem (Join-Path $data "logs") -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 80 }
            throw "the portable app never reported a smoke result"
          }
          # smoke mode closes the window, which quits the app; wait for the
          # launcher and app to exit so the folder can be inspected at rest
          $deadline = (Get-Date).AddMinutes(2)
          while ((Get-Process -Name "ASLBot*" -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          Get-Process -Name "ASLBot*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $line = Get-Content $result -Raw
          Write-Host $line
          if ($line -notmatch "renderer-ready") { throw "portable renderer smoke failed" }
          $report = ($line -replace '^\[smoke\] renderer-ready ', '') | ConvertFrom-Json
          foreach ($key in @("userData", "logs", "dataDir")) {
            $value = [string]$report.$key
            if (-not $value.StartsWith($data, [System.StringComparison]::OrdinalIgnoreCase)) { throw "$key is outside ASLBot-data: $value" }
          }
          foreach ($sub in @("data", "electron", "logs")) {
            if (-not (Test-Path (Join-Path $data $sub))) { throw "ASLBot-data\$sub was not created" }
          }
          if (-not (Test-Path (Join-Path $data "logs\server.log"))) { throw "server.log is not in ASLBot-data\logs" }
          foreach ($p in $hostPaths) { if (Test-Path $p) { throw "portable run wrote to the host: $p" } }
          Write-Host "portable exe kept its state in $data and left the host profile untouched"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
